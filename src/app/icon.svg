<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="favicon-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16181f" />
      <stop offset="1" stop-color="#07080b" />
    </linearGradient>
    <linearGradient id="favicon-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2be72" stop-opacity="0.62" />
      <stop offset="0.55" stop-color="#e2be72" stop-opacity="0.16" />
      <stop offset="1" stop-color="#e2be72" stop-opacity="0.04" />
    </linearGradient>
    <linearGradient id="favicon-wave" x1="0.1" y1="0.2" x2="0.9" y2="0.8">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.6" stop-color="#f3e3bd" />
      <stop offset="1" stop-color="#d4ae5f" />
    </linearGradient>
    <linearGradient id="favicon-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5dfa8" />
      <stop offset="1" stop-color="#c79a43" />
    </linearGradient>
    <linearGradient id="favicon-sheen" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="16" fill="url(#favicon-bg)" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="url(#favicon-sheen)" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="url(#favicon-edge)" stroke-width="1.75" />

  <path
    d="M 14 44 C 21 34, 27.5 34.5, 33.5 41.5 C 39.5 48.5, 45.5 46.5, 51 36"
    fill="none"
    stroke="url(#favicon-wave)"
    stroke-opacity="0.38"
    stroke-width="3.2"
    stroke-linecap="round"
  />
  <path
    d="M 12 36.5 C 18.5 18, 27 18.5, 32.5 31.5 C 38 44.5, 45.5 42.5, 51 23"
    fill="none"
    stroke="url(#favicon-wave)"
    stroke-width="5.4"
    stroke-linecap="round"
  />
  <circle cx="51" cy="23" r="3.6" fill="url(#favicon-accent)" />
